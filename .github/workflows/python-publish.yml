# This workflow overrides any potentially problematic "submit-pypi" check
# by defining a workflow with a matching name/job and setting it to
# manual dispatch only.

name: submit-pypi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-pypi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: No-op step
      run: echo "This workflow is manually triggered to avoid billing lock."
