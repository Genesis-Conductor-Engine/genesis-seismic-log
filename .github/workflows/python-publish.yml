name: Upload Python Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-pypi:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b53828bb5f496313b19aa91f41ab75b4fc5f4b
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
